    block: u=x+MHA(LN(x)); y=u+MoE(u)
    expert: LN->Linear->GELU->Linear
    final_norm: true
    fixed_sinusoidal_positions: true
    checkpoint_use_reentrant: false
    film: gamma*x+beta
