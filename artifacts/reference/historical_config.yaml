task:
  order:
  - static
  - temporal
  - dynamic
  - text_video
  descriptions:
    static: clarity, sharpness, color accuracy, and overall aesthetic appeal of the
      video frames
    temporal: Temporal smoothness evaluates the temporal coherence of video frames
      and the absence of temporal artifacts such as flickering or jittering.
    dynamic: Dynamic degree evaluates the extent to which the video incorporates large
      motions and dynamic scenes, which contributes to the overall liveliness and
      engagement measurement of the content.
    text_video: Text-video (TV) correspondence assesses how accurately the video content
      reflects the details, themes, and actions described in the prompt, ensuring
      that the generated video effectively translates the text input into a visual
      narrative.
