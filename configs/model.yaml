task:
  order:
  - static
  - temporal
  - dynamic
  - text_video
  descriptions:
    static: clarity, sharpness, color accuracy, and overall aesthetic appeal of the
      video frames
    temporal: Temporal smoothness evaluates the temporal coherence of video frames
      and the absence of temporal artifacts such as flickering or jittering.
    dynamic: Dynamic degree evaluates the extent to which the video incorporates large
      motions and dynamic scenes, which contributes to the overall liveliness and
      engagement measurement of the content.
    text_video: Text-video (TV) correspondence assesses how accurately the video content
      reflects the details, themes, and actions described in the prompt, ensuring
      that the generated video effectively translates the text input into a visual
      narrative.
model:
  head_policy: private
  film_video_condition: video_only
  name: multimodal_readout_variants
  d_model: 512
  dimension_encoder:
    kind: clip
    model_dir: /hdd/u202511081000084/IMC_QZL/pretrained_models/clip-vit-large-patch14
    feature_dim: 768
  artifact_query_sigmoid:
    num_queries: 2
    lambda_max: 2.0
    lambda_init: 0.1
    eps: 1.0e-06
  backbones:
    vital:
      model_dir: /hdd/u202511081000084/IMC_QZL/pretrained_models/VITAL-Vision-Encoder-300M
      dtype: bfloat16
      frame_chunk_size: 4
    slowfast:
      checkpoint_path: /hdd/u202511081000084/IMC_QZL/pretrained_models/slowfast.pth
      max_positions: 256
    blip:
      checkpoint_path: /hdd/u202511081000084/IMC_QZL/pretrained_models/model_large.pth
      bert_path: /hdd/u202511081000084/IMC_QZL/pretrained_models/bert-large-uncased
      med_config: /hdd/u202511081000084/IMC_QZL/AIDER/configs/med_config.json
      image_size: 224
      dtype: bfloat16
      text_parameter_precision: fp32_master_bf16_embedding_outputs
      max_text_length: 50
      text_padding: max_length
      train_text_encoder: true
      text_encoder_gradient_checkpointing: true
  two_stage_moe:
    num_experts: 7
    top_k: 2
    fusion_width: 1536
    first_stage: absent_task_film
    second_stage: 12_layer_transformer_moe
    head: task_private
  blip_temporal_sa: true
  task_embedding_transform: fp32_four_task_mean_subtract_then_row_l2_normalize
  readout_variant: film_transformer
  readout_spec:
    width: 1536
    depth: 12
    heads: 12
    num_experts: 7
    top_k: 2
    expert_hidden: 1536
    dropout: 0.0
    block: u=x+MHA(LN(x)); y=u+MoE(u)
    expert: LN->Linear->GELU->Linear
    final_norm: true
    fixed_sinusoidal_positions: true
    checkpoint_use_reentrant: false
    film: gamma*x+beta
    film_widths:
    - 512
    - 256
    - 768
    film_identity_init: true
  task_film_policy: private
  alpha_policy: private
  moe_gate_policy: private
